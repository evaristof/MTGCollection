# ---------------------------------------------------------------------------
# "prod" profile — PostgreSQL.
#
# Activated automatically by MtgCollectionApplication (the default entry point
# in the packaged jar). Override any value via environment variable or CLI arg
# if you need to, e.g.:
#
#   java -jar mtgcollection.jar \
#        --spring.datasource.url=jdbc:postgresql://db.internal:5432/mtgdb \
#        --spring.datasource.username=myuser \
#        --spring.datasource.password=mypass
#
# or via env vars:
#   SPRING_DATASOURCE_URL=...
#   SPRING_DATASOURCE_USERNAME=...
#   SPRING_DATASOURCE_PASSWORD=...
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/mtgdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=admin
# TODO: move to env var / secret store before exposing the app outside localhost.
spring.datasource.password=admin

# Disable the H2 console (we are not using H2 here).
spring.h2.console.enabled=false

# Connection pool sized so the parallel "Reconstruir Modelo" build (see
# scanner.model.build-threads=18) doesn't queue on connections for its
# concurrent per-card saves. A couple spare for the rest of the app.
spring.datasource.hikari.maximum-pool-size=20

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
# Once any jakarta.persistence.schema-generation.* property is set, Hibernate
# uses JPA-standard schema management and IGNORES the legacy ddl-auto above — so
# without this, new columns were never applied to the DB. database.action=update
# makes it update the database (adds missing tables/columns; never drops).
# NOTE: we deliberately do NOT generate DDL script files (the scripts.* options)
# — they were rewritten to the working dir on every boot. Boot the app or run
# `pg_dump --schema-only` if you ever need a schema snapshot.
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=update
